[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "animal-ai-incident-obsv"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "tablib",
    "psycopg",
    "django",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["pipeline"]
